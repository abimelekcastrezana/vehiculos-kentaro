{# Campos compartidos por nuevo.html y editar.html. Validación HTML5: required, type, min, max #}
<label>Marca
  <select name="marca_id" required>
    <option value="">-- Selecciona --</option>
    {% for m in marcas %}
      <option value="{{ m.id }}" {{ 'selected' if datos.marca_id|string == m.id|string }}>{{ m.nombre }}</option>
    {% endfor %}
  </select>
</label>

<label>Tipo
  <select name="tipo_id" required>
    <option value="">-- Selecciona --</option>
    {% for t in tipos %}
      <option value="{{ t.id }}" {{ 'selected' if datos.tipo_id|string == t.id|string }}>{{ t.nombre }}</option>
    {% endfor %}
  </select>
</label>

<label>Lote
  <select name="lote_id" required>
    <option value="">-- Selecciona --</option>
    {% for l in lotes %}
      <option value="{{ l.id }}" {{ 'selected' if datos.lote_id|string == l.id|string }}>{{ l.nombre }}</option>
    {% endfor %}
  </select>
</label>

<label>Modelo <input name="modelo" value="{{ datos.modelo }}" required></label>
<label>Año <input name="anio" type="number" min="1900" max="2100" value="{{ datos.anio }}" required></label>
<label>Precio <input name="precio" type="number" min="0.01" step="0.01" value="{{ datos.precio }}" required></label>
<label>Descripción <textarea name="descripcion" required>{{ datos.descripcion }}</textarea></label>
<label>URL de la imagen (opcional) <input name="imagen_url" type="url" value="{{ datos.imagen_url or '' }}"></label>
